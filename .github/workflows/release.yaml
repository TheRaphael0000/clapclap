name: release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7.0.1

            - name: Process Version Tag
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${REF_NAME#v}"
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            - name: Set up Python
              uses: actions/setup-python@v7.1.0
              with:
                  python-version: "3.13"

            - name: Install Hatch
              run: |
                  python -m pip install --upgrade pip
                  pip install --upgrade hatch

            - name: Configuring Version
              run: sed s/"0.0.0"/"${{ steps.version.outputs.version }}"/g -i pyproject.toml

            - name: Hatch Build
              run: hatch build -t wheel -c

            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create ${{ github.ref }} \
                  --title "Release ${{ github.ref_name }}" \
                  --generate-notes \
                  dist/*.whl
