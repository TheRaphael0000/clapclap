name: release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Process Version
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${REF_NAME#v}"
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            - name: Configuring version
              run: sed s/"0.0.0"/"${{ steps.version.outputs.version }}"/g -i pyproject.toml

            - name: Build
              run: hatch build

            - name: Create Release
              id: create_release
              uses: actions/create-release@v1.1.4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref }}
                  release_name: Release ${{ github.ref_name }}
                  draft: false
                  prerelease: false

            - name: Upload Release Asset
              uses: actions/upload-release-asset@v1.0.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: dist/clapclap-${{ steps.version.outputs.version }}-py3-none-any.whl
                  asset_name: clapclap-${{ steps.version.outputs.version }}-py3-none-any.whl
                  asset_content_type: application/x-binary
