[project]
name = "clapclap"
version = "0.1.0"
description = "A CLAP CLI for navidrome"
readme = "README.md"
requires-python = ">=3.13"
maintainers = [
  {name = "TheRaphael0000", email = "me@theraphael0000.ch"}
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pgvector>=0.5.0",
    "sqlalchemy>=2.1.1",
    "opendht>=4.4.1",
    "numpy>=2.5.3",
    "filetype>=1.2.0",
    "tinytag>=2.3.2",
    "faiss-cpu>=1.15.1",
    "uvicorn>=0.54.0",
    "u-msgpack-python>=2.8.0",
    "python-decouple>=3.8",
    "scipy>=1.18.1",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "psycopg[binary]>=3.3.6",
]

[project.optional-dependencies]
full = [
    "transformers>=5.17.0",
    "torch>=2.14.0",
    "torchcodec>=0.16.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
clapclap = "clapclap.cli:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clapclap"]
