[project]
name = "clapclap"
description = "A CLAP CLI for navidrome"
readme = "README.md"
requires-python = ">=3.13"
version = "0.0.0"
keywords = [
    "audio-processing",
    "audio-recommendation",
    "clap",
    "music-recommendation",
    "navidrome-plugin",
    "recommender-system",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "platformdirs>=4.13.0",
    "pgvector>=0.5.0",
    "sqlalchemy>=2.1.1",
    "opendht>=4.4.1",
    "numpy>=2.5.3",
    "filetype>=1.2.0",
    "tinytag>=2.3.2",
    "faiss-cpu>=1.15.1",
    "uvicorn>=0.54.0",
    "u-msgpack-python>=2.8.0",
    "python-decouple>=3.8",
    "scipy>=1.18.1",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = ["autopep8>=2.3.2", "hatch>=1.18.1"]

[project.optional-dependencies]
all = [
    "transformers>=5.17.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchcodec>=0.16.0",
    "torchaudio>=2.11.0",
    "umap-learn>=0.5.12",
]

[project.urls]
"Source code" = "https://github.com/TheRaphael0000/clapclap"

[project.scripts]
clapclap = "clapclap.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clapclap"]

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
